name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fila
          POSTGRES_PASSWORD: fila
          POSTGRES_DB: fila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fila -d fila"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fila:fila@localhost:5432/fila?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: CI=true pnpm install --frozen-lockfile

      # Mesmo comando de produção: migrate deploy → generate → next build
      - run: pnpm run build
